services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false

    Softspring\CmsMcpPlugin\:
        resource: '../../src/*'
        exclude: '../../src/DependencyInjection/*'

    Softspring\CmsMcpPlugin\Mcp\AnalyticsTools:
        arguments:
            $analyticsServices: !service_locator
                statistics_provider_chain: '@?Softspring\CmsAnalyticsPlugin\Analytics\StatisticsProviderChain'
